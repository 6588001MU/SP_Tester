<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Invited Friends</title>
  <link rel="stylesheet" href="InvitedFriend.css">
</head>
<body>

<div class="invited-container">

  <h2 class="title">Invited Friends :</h2>

  <div class="invited-grid">

    <!-- Friend 1 -->
    <div class="invite-card">
      <div class="avatar"></div>

      <div class="invite-info">
        <div class="uid">UID : 6X88XXX</div>

        <div class="name-row">
          <span>Name :</span>
          <span>Surname :</span>
        </div>

        <div class="invite-row">
          <label>Invite to :</label>
          <div class="invite-select">
            <span class="selected">GROUP</span>
            <span class="arrow">▼</span>
          </div>
        </div>
      </div>

      <div class="invite-action">
        <button class="invite-btn">Invite</button>
      </div>
    </div>
